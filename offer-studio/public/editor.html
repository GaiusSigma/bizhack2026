<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FigCraft · Offer Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ce5e64'/%3E%3Cpath d='M9 22 16 9l7 13z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { overflow: hidden; }
    .ed-bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 44px; }
    .ed-bar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .ed-bar .hint { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #eee; color: var(--muted); white-space: nowrap; }
    .pill.ok { background: #e3f4e1; color: var(--ok); }
    .pill.dirty { background: #fff3d6; color: #8a5a00; }
    .pill.err { background: #fde7e5; color: var(--danger); }
    .banner { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .banner[hidden] { display: none; }
    .banner.err { background: #fde7e5; color: #6b1510; }
    .banner.warn { background: #fff3d6; color: #5c3d00; }
    .banner.info { background: #eef4fb; color: #1b3a5c; }
    .banner .msg { flex: 1; min-width: 200px; }
    #fc { flex: 1; width: 100%; border: 0; display: block; background: #f5f5f5; }
    @media (max-width: 900px) { .ed-bar .hint { display: none; } }
  </style>
</head>
<body>
  <header class="ed-bar">
    <a class="btn ghost" href="/#/templates" id="back" title="Back to the slide library">← Offer Studio</a>
    <span class="title" id="title">FigCraft</span>
    <span class="pill" id="state">Loading FigCraft…</span>
    <span class="hint" id="hint"></span>
    <span class="spacer"></span>
    <button class="btn sm ghost" id="author" title="Your name on comments and notes in FigCraft"></button>
  </header>
  <div class="banner" id="banner" hidden><span class="msg"></span><span class="acts"></span></div>
  <iframe id="fc" title="FigCraft interface design tool" allow="fullscreen; clipboard-read; clipboard-write; local-fonts" allowfullscreen></iframe>
  <div id="toast" hidden></div>
  <script type="module" src="/static/editor.js"></script>
</body>
</html>
