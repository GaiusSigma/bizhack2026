# Upgrade to WebSocket only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # The .wasm file is about 25 MB; compression shrinks it several times (HOSTING.md in the release).
    # MIME types (including application/wasm) come from nginx's global mime.types.
    # A `types {}` block in server would replace the whole list and HTML would be sent as octet-stream.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript text/css;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Collaboration server (figcraft-server) on the same domain: wss://<domain>/sync/
    # The name is resolved lazily via Docker DNS, so nginx starts even without the server.
    location /sync/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $figcraft_server figcraft-server:47900;
        proxy_pass http://$figcraft_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app pings every 15 s; the server drops the connection after 45 s of inactivity.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 128m;
    }

    # Files with a hash in the name: cache forever.
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.orig$ { return 404; }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
