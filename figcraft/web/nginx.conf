# Upgrade WebSocket tylko gdy klient o niego prosi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # Plik .wasm ma ok. 25 MB, kompresja zmniejsza go kilkukrotnie (HOSTING.md z releasu).
    types { application/wasm wasm; }
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript text/css;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Serwer współpracy (figcraft-server) pod tą samą domeną: wss://<domena>/sync/
    # Nazwa rozwiązywana leniwie przez DNS Dockera, więc nginx wstaje także bez serwera.
    location /sync/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $figcraft_server figcraft-server:47900;
        proxy_pass http://$figcraft_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Aplikacja pinguje co 15 s, serwer zrywa połączenie po 45 s bezczynności.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 128m;
    }

    # Pliki z hashem w nazwie: cache na zawsze.
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.orig$ { return 404; }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
