# Stack BizHack 2026: landing (Astro + nginx), n8n (+ Postgres, task runners), FigCraft web (+ collaboration server), Offer Studio.
#
# The file is set up for Coolify ("Docker Compose" build pack):
#   - SERVICE_URL_<SERVICE>_<PORT>  -> Coolify generates a domain and routes traffic to this container port,
#   - SERVICE_USER_* / SERVICE_PASSWORD_* -> Coolify generates and stores the credentials,
#   - no `ports:`: internet traffic goes only through the Coolify proxy (Traefik) with HTTPS.
#
# Locally: copy .env.example to .env and run
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  # ---------------------------------------------------------------- landing
  landing:
    build:
      context: ./landing
      args:
        SITE_URL: ${SERVICE_URL_LANDING}
        PUBLIC_OFFER_WEBHOOK_URL: ${OFFER_WEBHOOK_URL:-}
    environment:
      - SERVICE_URL_LANDING_80
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------- n8n
  # Image = official n8nio/n8n + the Offer Studio nodes (n8n/n8n-nodes-offer-studio), see n8n/Dockerfile.
  n8n:
    build:
      context: ./n8n
      args:
        N8N_VERSION: 2.50.0
    environment:
      - SERVICE_URL_N8N_5678
      # Default "Offer Studio API" credential: n8n fills in the URL and token itself (n8n/entrypoint.sh).
      - OFFER_STUDIO_URL=http://offer-studio:3000
      - OFFER_STUDIO_API_TOKEN=${SERVICE_PASSWORD_64_STUDIOAPI}
      # Optional: the OpenRouter key for the models in the offer workflows (n8n/entrypoint.sh fills the credential).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - N8N_EDITOR_BASE_URL=${SERVICE_URL_N8N}
      - WEBHOOK_URL=${SERVICE_URL_N8N}
      - N8N_HOST=${SERVICE_URL_N8N}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-1}
      - N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_64_N8NKEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Warsaw}
      - TZ=${TZ:-Europe/Warsaw}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_USER=${SERVICE_USER_POSTGRES}
      - DB_POSTGRESDB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8NRUNNERS}
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10

  n8n-runners:
    # Same version as N8N_VERSION of the n8n service.
    image: n8nio/runners:2.50.0
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8NRUNNERS}
      # Runner stays up (0 = never shut down when idle) and takes up to 20 tasks at once: many leads at the same
      # moment (a demo room) otherwise wait for a cold start and queue behind 5 slots.
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-0}
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-20}
    depends_on:
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5680/healthz || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

  # ---------------------------------------------------------------- FigCraft
  # Web app (WASM) + /sync/ proxy to the collaboration server, one domain.
  figcraft:
    build:
      context: ./figcraft/web
    environment:
      - SERVICE_URL_FIGCRAFT_80
      - FIGCRAFT_PUBLIC_URL=${SERVICE_URL_FIGCRAFT}
    depends_on:
      - figcraft-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Collaboration server: file sharing, links, team file list.
  # Reachable only through the `figcraft` container at wss://<figcraft-domain>/sync/.
  figcraft-server:
    build:
      context: ./figcraft/server
    environment:
      - FIGCRAFT_PUBLIC_URL=${SERVICE_URL_FIGCRAFT}
      - FIGCRAFT_OPEN_PUBLISH=${FIGCRAFT_OPEN_PUBLISH:-false}
      # The team file list is visible to ANYONE who can reach the server. Off by default.
      - FIGCRAFT_TEAM_FILES=${FIGCRAFT_TEAM_FILES:-}
      - FIGCRAFT_MAX_FILE_MB=${FIGCRAFT_MAX_FILE_MB:-64}
    volumes:
      - figcraft-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:47900/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------- Offer Studio
  # Knowledge base (blocks) + building offers from slides. FigCraft renders the slides, preview and PDF
  # (figcraft-cli in the image) from a .figcraft template. Data in SQLite.
  offer-studio:
    build:
      context: ./offer-studio
    environment:
      - SERVICE_URL_OFFER_STUDIO_3000
      # Browser login: any username + this password. API: "Authorization: Bearer <token>" header.
      - STUDIO_PASSWORD=${SERVICE_PASSWORD_STUDIO}
      - STUDIO_API_TOKEN=${SERVICE_PASSWORD_64_STUDIOAPI}
      # "Open FigCraft" link in the dashboard (the web version from this stack).
      - FIGCRAFT_WEB_URL=${SERVICE_URL_FIGCRAFT}
      # Card picking by Claude ("Pick cards (AI)"). Without a key everything else works and the AI returns 503.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - STUDIO_AI_MODEL=${STUDIO_AI_MODEL:-claude-opus-5-5}
    volumes:
      - offer-studio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  n8n-data:
  postgres-data:
  figcraft-data:
  offer-studio-data:
