# Stack BizHack 2026: landing (Astro + nginx), n8n (+ Postgres, task runners), FigCraft web (+ serwer współpracy).
#
# Plik jest przygotowany pod Coolify (build pack "Docker Compose"):
#   - SERVICE_URL_<USŁUGA>_<PORT>  -> Coolify generuje domenę i kieruje ruch na ten port kontenera,
#   - SERVICE_USER_* / SERVICE_PASSWORD_* -> Coolify generuje i zapamiętuje dane logowania,
#   - brak `ports:`: ruch z internetu idzie wyłącznie przez proxy Coolify (Traefik) z HTTPS.
#
# Lokalnie: skopiuj .env.example do .env i uruchom
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  # ---------------------------------------------------------------- landing
  landing:
    build:
      context: ./landing
      args:
        SITE_URL: ${SERVICE_URL_LANDING}
    environment:
      - SERVICE_URL_LANDING_80
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------- n8n
  n8n:
    image: n8nio/n8n:2.50.0
    environment:
      - SERVICE_URL_N8N_5678
      - N8N_EDITOR_BASE_URL=${SERVICE_URL_N8N}
      - WEBHOOK_URL=${SERVICE_URL_N8N}
      - N8N_HOST=${SERVICE_URL_N8N}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-1}
      - N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_64_N8NKEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Warsaw}
      - TZ=${TZ:-Europe/Warsaw}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_USER=${SERVICE_USER_POSTGRES}
      - DB_POSTGRESDB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8NRUNNERS}
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10

  n8n-runners:
    image: n8nio/runners:2.50.0
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8NRUNNERS}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
    depends_on:
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5680/healthz || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

  # ---------------------------------------------------------------- FigCraft
  # Aplikacja webowa (WASM) + proxy /sync/ do serwera współpracy, jedna domena.
  figcraft:
    build:
      context: ./figcraft/web
    environment:
      - SERVICE_URL_FIGCRAFT_80
      - FIGCRAFT_PUBLIC_URL=${SERVICE_URL_FIGCRAFT}
    depends_on:
      - figcraft-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Serwer współpracy: udostępnianie plików, linki, lista plików zespołu.
  # Dostępny tylko przez kontener `figcraft` pod wss://<domena-figcraft>/sync/.
  figcraft-server:
    build:
      context: ./figcraft/server
    environment:
      - FIGCRAFT_PUBLIC_URL=${SERVICE_URL_FIGCRAFT}
      - FIGCRAFT_OPEN_PUBLISH=${FIGCRAFT_OPEN_PUBLISH:-false}
      # Lista plików zespołu jest widoczna dla KAŻDEGO, kto dotrze do serwera. Domyślnie wyłączona.
      - FIGCRAFT_TEAM_FILES=${FIGCRAFT_TEAM_FILES:-}
      - FIGCRAFT_MAX_FILE_MB=${FIGCRAFT_MAX_FILE_MB:-64}
    volumes:
      - figcraft-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:47900/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------- Offer Studio
  # Baza wiedzy (bloki) + składanie ofert ze slajdów. Slajdy, podgląd i PDF renderuje FigCraft
  # (figcraft-cli w obrazie) z szablonu .figcraft. Dane w SQLite.
  offer-studio:
    build:
      context: ./offer-studio
    environment:
      - SERVICE_URL_OFFER_STUDIO_3000
      # Logowanie w przeglądarce: dowolny login + to hasło. API: nagłówek "Authorization: Bearer <token>".
      - STUDIO_PASSWORD=${SERVICE_PASSWORD_STUDIO}
      - STUDIO_API_TOKEN=${SERVICE_PASSWORD_64_STUDIOAPI}
      # Link „Otwórz FigCraft” w dashboardzie (wersja webowa z tego stacku).
      - FIGCRAFT_WEB_URL=${SERVICE_URL_FIGCRAFT}
    volumes:
      - offer-studio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  n8n-data:
  postgres-data:
  figcraft-data:
  offer-studio-data:
